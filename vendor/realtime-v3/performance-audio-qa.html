<!doctype html><html lang="zh"><meta charset="utf-8"><title>HarBeat 现场控制音频检查</title><body><h1>现场控制数字音频检查</h1><p>使用 OfflineAudioContext 离线渲染，不向扬声器播放。</p><button id="run">运行检查</button><pre id="result">等待运行</pre><script type="module">
import {PerformanceEffects} from './src/mobile/performance-effects.ts';
import {planScratch,renderScratch} from './src/mobile/performance-plan.ts';
const sr=44100;
const amp=(x,f,a,b)=>{let u=0,v=0;const from=Math.round(a*sr),to=Math.round(b*sr);for(let i=from;i<to;i++){u+=x[i]*Math.cos(2*Math.PI*f*i/sr);v+=x[i]*Math.sin(2*Math.PI*f*i/sr)}return 2*Math.hypot(u,v)/(to-from)};
function tone(ctx,fs){const b=ctx.createBuffer(2,4*sr,sr);for(let c=0;c<2;c++)for(let i=0;i<b.length;i++)b.getChannelData(c)[i]=fs.reduce((s,[f,a])=>s+a*Math.sin(2*Math.PI*f*i/sr),0);return b}
async function host(){const ctx=new OfflineAudioContext(2,4*sr,sr),fx=new PerformanceEffects(ctx,ctx.destination),source=ctx.createBufferSource();source.buffer=tone(ctx,[[100,.2],[2000,.2]]);source.connect(fx.input);source.start();fx.setMC(true);const paused=ctx.suspend(1.2),rendering=ctx.startRendering();await paused;fx.setMC(false);await ctx.resume();const x=(await rendering).getChannelData(0),bass=amp(x,100,.8,1.1)/.2,voiceBand=amp(x,2000,.8,1.1)/.2,restored=amp(x,2000,2,3)/.2;return{bass,voiceBand,restored,pass:bass>.9&&voiceBand<.03&&Math.abs(restored-1)<.01}}
async function scratch(cancel){const ctx=new OfflineAudioContext(2,4*sr,sr),fx=new PerformanceEffects(ctx,ctx.destination),source=ctx.createBufferSource(),original=tone(ctx,[[110,.15],[587,.1]]);source.buffer=original;source.connect(fx.input);source.start();const sha='a'.repeat(64),track={id:'qa',duration:40,provenance:{masterSha256:sha},alignment:{source:{masterSha256:sha},bandFrames:Array.from({length:800},(_,i)=>({start:i*.05,end:(i+1)*.05,low:-25,mid:i%4===0?-15:-45,high:-30})),bars:Array.from({length:20},(_,i)=>({valid:true,start:i*2,end:i*2+2,beats:[0,.5,1,1.5].map(x=>x+i*2)}))}},plan=planScratch(track,0),samples=renderScratch([original.getChannelData(0).slice(Math.floor(plan.sourceStart*sr),Math.ceil((plan.sourceStart+plan.sourceDuration)*sr)+1),original.getChannelData(1).slice(Math.floor(plan.sourceStart*sr),Math.ceil((plan.sourceStart+plan.sourceDuration)*sr)+1)],sr,plan),clip=ctx.createBuffer(2,samples[0].length,sr);samples.forEach((x,c)=>clip.getChannelData(c).set(x));fx.scratch(clip,.5);let render;if(cancel){const paused=ctx.suspend(.75);render=ctx.startRendering();await paused;fx.cancelScratch(true);await ctx.resume()}else render=ctx.startRendering();const out=(await render).getChannelData(0),reference=original.getChannelData(0);let error=0,peak=0;for(let i=0;i<out.length;i++){peak=Math.max(peak,Math.abs(out[i]));if(i>2*sr)error=Math.max(error,Math.abs(out[i]-reference[i]))}return{cancel,duration:plan.duration,peak,postRestoreMaximumError:error,pass:error<1e-5&&peak<.95}}
async function takeover(){const ctx=new OfflineAudioContext(2,4*sr,sr),fx=new PerformanceEffects(ctx,ctx.destination),source=ctx.createBufferSource(),original=tone(ctx,[[997,.15]]),clip=ctx.createBuffer(2,sr,sr);source.buffer=original;source.connect(fx.input);source.start();for(let c=0;c<2;c++)for(let i=0;i<sr;i++)clip.getChannelData(c)[i]=.2*Math.sin(2*Math.PI*1500*i/sr);fx.scratch(clip,.5);const x=(await ctx.startRendering()).getChannelData(0),originalDuring=amp(x,997,.65,1.35),scratchDuring=amp(x,1500,.65,1.35);let recoveryError=0;for(let i=Math.ceil(1.5001*sr);i<1.7*sr;i++)recoveryError=Math.max(recoveryError,Math.abs(x[i]-original.getChannelData(0)[i]));return{originalDuring,scratchDuring,recoveryError,pass:originalDuring<.0015&&Math.abs(scratchDuring-.12)<.002&&recoveryError<1e-5}}
document.querySelector('#run').onclick=async()=>{try{const h=await host(),s=await scratch(false),c=await scratch(true),t=await takeover();document.querySelector('#result').textContent=JSON.stringify({pass:h.pass&&s.pass&&c.pass&&t.pass,host:h,scratch:s,cancelled:c,takeover:t},null,2)}catch(e){document.querySelector('#result').textContent=String(e.stack||e)}};
</script></body></html>
