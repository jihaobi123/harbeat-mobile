<h1>B 鼓声部提前叠放</h1>
<p>每组比较原渐混、此前较好的单项，以及只增加 B 自然鼓提前进入的版本。主交接点、速度、其他声部曲线、EQ 和人声规则固定。</p>
<p class="note">B 鼓用一小节轻轻进入，保持两小节，再接入原主窗口。三版编号在每组内打乱；可随时换版本、记录选择，不需要听完整段。资料不足的曲对会跳过。</p>
<p class="note" id="round-note"></p>
<div class="controls"><button id="pause" type="button">暂停 / 继续</button><button id="stop" type="button">停止</button><button id="export" type="button">导出我的记录</button></div>
