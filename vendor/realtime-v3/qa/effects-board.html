<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HarBeat 新手法试听</title><style>body{margin:0;background:#f5f4ed;color:#17281e;font:16px system-ui}main{max-width:1120px;margin:auto;padding:28px}h1{font-size:34px}p{line-height:1.7}.top{display:flex;gap:16px;align-items:center;flex-wrap:wrap}button,select{font:inherit;padding:10px;border-radius:8px;border:1px solid #bdc9b5;background:#fff}section{margin:24px 0;padding:22px;border:1px solid #cdd4c5;background:#fffef8;border-radius:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.version{padding:12px;background:#eef2e6;border-radius:10px}audio{width:100%;margin:10px 0}.meta{font-size:13px;color:#5c6d58}.ratings{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:18px}a{color:#315a37}#saved{color:#48623e}</style><main><div class="top"><strong>HarBeat · 新手法试听</strong><a href="http://127.0.0.1:5180/audition/">原24组试听</a><button id="stop">停止全部</button><button id="export">导出试听选择</button></div><h1>同一个接点，换一种收尾。</h1><p>8组曲对，32段新效果、4段真实鼓桥，附原有短切与回声对照。四种新效果仅在电脑试听；鼓桥使用手机上的执行图。下一首均原速进入。鼓桥另插入8拍，长度与直接短切不同。</p><p class="meta">已核对来源指纹、有限时长、原速接管与未限幅峰值；这些检查不代表听感优劣。真人评分尚未填写。</p><div id="saved"></div><div id="pairs"></div></main><script>
const key='harbeat-new-effects-20261026',data=__MANIFEST__;let ratings=JSON.parse(localStorage.getItem(key)||'{}');function save(){localStorage.setItem(key,JSON.stringify(ratings));document.querySelector('#saved').textContent='已记录 '+Object.keys(ratings).length+' 组选择，仅保存在本浏览器'}
for(const p of data.pairs){const section=document.createElement('section'),title=document.createElement('h2');title.textContent=p.a.title+' → '+p.b.title;section.append(title);const note=document.createElement('p');note.className='meta';note.textContent=p.cohort+' · '+p.a.bpm+' → '+p.b.bpm+' BPM';section.append(note);const grid=document.createElement('div');grid.className='grid';for(const m of p.methods){const d=document.createElement('div');d.className='version';const label=document.createElement('strong');label.textContent=m.name;const audio=document.createElement('audio');audio.controls=true;audio.preload='none';audio.src=m.file;audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(a=>{if(a!==audio)a.pause()}));const meta=document.createElement('div');meta.className='meta';meta.textContent=m.peak==null?'原有方法对照':'未限幅峰值 '+m.peak.toFixed(3)+' · '+(m.scope==='experimental-phone-graph'?'手机实验执行图':'电脑实验');d.append(label,audio,meta);grid.append(d)}section.append(grid);const label=document.createElement('label');label.className='ratings';label.textContent='这组更喜欢：';const select=document.createElement('select');for(const [value,text] of [['','尚未选择'],...p.methods.map(m=>[m.method,m.name]),['same','差不多'],['neither','都需改进']]){const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o)}select.value=ratings[p.id]||'';select.onchange=()=>{ratings[p.id]=select.value;save()};label.append(select);section.append(label);document.querySelector('#pairs').append(section)}document.querySelector('#stop').onclick=()=>document.querySelectorAll('audio').forEach(a=>a.pause());document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({schema:'harbeat-new-effects-feedback.v1',ratings,sourceManifestSha256:'__FINGERPRINT__',exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='harbeat-new-effects-feedback.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};save();</script></html>
