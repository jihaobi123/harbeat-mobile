<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HarBeat · 四首分工试听</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#242121;font:16px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:28px 20px 90px}h1{font-size:30px;line-height:1.3}h2{font-size:21px}section{background:white;border-radius:18px;padding:24px;margin:24px 0}button{border:0;border-radius:12px;padding:12px 16px;background:#ede9e5;font:inherit;margin:8px 8px 8px 0;cursor:pointer}button.active{background:#a62d36;color:white}table{width:100%;border-collapse:collapse}td{padding:7px;border-bottom:1px solid #eee}td:first-child{width:80px;color:#746c68}input[type=range]{width:78%;accent-color:#a62d36}label{display:block;margin:8px 0}input[type=radio]{accent-color:#a62d36}textarea{width:100%;min-height:80px;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.quality{color:#982d35;background:#f8ebeb;padding:12px;border-radius:10px}output{display:block;color:#8c3438;font-size:14px;margin:12px 0}.muted{color:#726b68}</style><main><div class="muted">HARBEAT / 声部分工试验</div><h1>四首音乐，各负责一个声部。</h1><p>固定原 A/B 的接点、速度和退出。先只换旋律伴奏，再只换人声。重点听约 7–14 秒；其余位置保持原方案。</p><p class="muted">本页按 Jetson 准备的声部素材与时间线播放；待复核样例会明确标注，反馈不会自动生成手机执行批准。other 是分离出的伴奏，可能包含多种乐器。是否更好由你判断；手机的普通混音和后备保持原样。</p><div id="cases"></div><button id="export">导出选择</button><p id="saved"></p><script type="module" src="preview.js"></script></main></html>
