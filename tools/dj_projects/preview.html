<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HarBeat · 公开 DJ 案例对比</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: #f7f5f3;
      color: #262326;
      font:
        16px/1.6 system-ui,
        sans-serif;
    }
    main {
      max-width: 780px;
      margin: auto;
      padding: 32px 22px 90px;
    }
    h1 {
      font-size: 30px;
      line-height: 1.3;
    }
    h2 {
      font-size: 22px;
    }
    .muted {
      color: #6d6565;
    }
    section {
      background: #fff;
      padding: 24px;
      border-radius: 18px;
      margin-top: 24px;
    }
    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }
    button {
      background: #eee9e5;
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font: inherit;
      cursor: pointer;
    }
    button[data-variant] {
      background: #9e2933;
      color: white;
      flex: 1;
      min-width: 200px;
    }
    button:disabled {
      opacity: 0.5;
    }
    progress {
      width: 100%;
      accent-color: #9e2933;
      margin-top: 24px;
    }
    output {
      display: block;
      margin-top: 12px;
    }
    label {
      display: block;
      padding: 10px 0;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      font: inherit;
    }
    a {
      color: #9e2933;
    }
    #saved {
      color: #9e2933;
    }
  </style>
  <main>
    <p class="muted">HARBEAT / DJ HAPA 教学案例</p>
    <h1>让两首歌共同播放一段，再交给 B。</h1>
    <p id="pair">正在读取已核验的两首音频</p>
    <p id="cues" class="muted"></p>
    <section>
      <div class="buttons">
        <button data-variant="original" disabled>试听原方案 · 8 拍渐混</button
        ><button data-variant="reference" disabled>
          试听参考方案 · 渐入／保持／渐出
        </button>
      </div>
      <progress id="progress" value="0" max="1"></progress
      ><span id="timing">0:00 / 0:00</span>
      <div class="buttons">
        <button id="pause">暂停</button><button id="resume">继续</button
        ><button id="stop">停止</button>
      </div>
      <output id="status">正在核验来源与批准</output>
    </section>
    <section>
      <h2>你的选择</h2>
      <p class="muted">可以随时选择。实际听过的区间另行记录。</p>
      <label
        ><input
          type="radio"
          name="preference"
          value="original"
        />原方案更顺</label
      >
      <label
        ><input
          type="radio"
          name="preference"
          value="reference"
        />参考方案更顺</label
      >
      <label><input type="radio" name="preference" value="same" />差不多</label>
      <label
        ><input type="radio" name="preference" value="neither" />都不合适</label
      >
      <textarea
        id="notes"
        placeholder="哪里更顺，哪里拥挤或音量有变化"
      ></textarea>
      <output id="saved"></output><button id="export">导出记录</button>
    </section>
    <section>
      <h2>案例来源与接点</h2>
      <p>
        音频来自 DJUCED 官方同期示范素材。视频第二次演示先提高 B
        的音量，保持两首共同播放，再退出
        A。两版采用同一曲对、源接点和音量余量，前有 4 秒 A 独奏，后有 8 秒 B
        续播。
      </p>
      <p id="source-note" class="muted"></p>
      <p>
        <a
          href="https://www.youtube.com/watch?v=aqFRSSYp2bg&t=287s"
          target="_blank"
          rel="noopener"
          >查看公开演示</a
        >
        · <a href="reference-case/case.json">本次批准与来源</a>
      </p>
    </section>
    <script type="module" src="./preview.ts"></script>
  </main>
</html>
