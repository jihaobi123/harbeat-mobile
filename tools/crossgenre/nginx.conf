# Isolated public, source-bound crossgenre metadata; audio remains in existing routes.
location = /listen/crossgenre/index.json {
    alias /srv/harbeat-listen/crossgenre-current/index.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location ^~ /listen/crossgenre/objects/ {
    alias /srv/harbeat-listen/crossgenre-current/objects/;
    default_type application/json;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location /listen/crossgenre/ { return 404; }
