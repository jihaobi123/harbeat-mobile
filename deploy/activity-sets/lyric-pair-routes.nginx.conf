location = /listen/transition-policy/v1/index.json {
    alias /srv/harbeat-listen/transition-policy/v1/index.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}

location ^~ /listen/transition-policy/v1/covers/ {
    if ($uri !~ "^/listen/transition-policy/v1/covers/[a-f0-9]{64}\.jpg$") { return 404; }
    alias /srv/harbeat-listen/cohort-current/covers/;
    default_type image/jpeg;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
