# Public source-bound device assets only. No NAS paths, credentials or reports.
location = /listen/execution/index.json {
    alias /srv/harbeat-listen/execution-current/index.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location ~ "^/listen/execution/tracks/([A-Za-z0-9_-]{1,160})\.json$" {
    alias /srv/harbeat-listen/execution-current/tracks/$1.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location ~ "^/listen/execution/profiles/([a-f0-9]{64})\.json$" {
    alias /srv/harbeat-listen/execution-current/profiles/$1.json;
    default_type application/json;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location ~ "^/listen/execution-media/([a-f0-9]{64})\.(flac|wav)$" {
    alias /srv/harbeat-listen/execution-current/objects/$1.$2;
    types { audio/flac flac; audio/wav wav; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    limit_except GET { deny all; }
}
location /listen/execution/ { return 404; }
location /listen/execution-media/ { return 404; }
