# Include inside the existing HTTPS server, alongside the set API/media routes.
location = /listen/app { return 308 /listen/app/; }
location ^~ /listen/app/ {
    alias /srv/harbeat-listen/mobile-current/;
    index index.html;
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        font/otf otf;
        font/ttf ttf;
        font/woff2 woff2;
    }
    try_files $uri $uri/ /listen/app/index.html;
    autoindex off;
    limit_except GET { deny all; }
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
