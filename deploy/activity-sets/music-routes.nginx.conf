# Add before the existing /listen/set-api/ location. Existing admin routes remain unchanged.
location = /listen/set-api/music/upload {
    client_max_body_size 101m;
    proxy_request_buffering off;
    proxy_pass http://127.0.0.1:8792/music/upload;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_read_timeout 90s;
}
location ~ "^/listen/music-covers/([a-f0-9]{64})\.jpg$" {
    alias /srv/harbeat-listen/activity-sets/music-covers/$1.jpg;
    default_type image/jpeg;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location /listen/music-covers/ { return 404; }
