# Add inside the existing HTTPS server; ^~ bypasses broad listening/media regexes.
location ^~ /listen/set-api/ {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8792/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# These assets contain only already-public library audio; reservation/workspace
# metadata is never served here. All filename components are generated identities.
location ~ "^/listen/set-media/([a-f0-9]{32})/([a-f0-9]{64})/(original|bass|filter|yield|vocal|bass_filter)\.wav$" {
    alias /srv/harbeat-listen/activity-sets/media/$1/$2/$3.wav;
    default_type audio/wav;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    disable_symlinks on;
}
location /listen/set-media/ { return 404; }
